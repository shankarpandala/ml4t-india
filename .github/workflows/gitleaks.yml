name: gitleaks

# Secret-scanning guard. Runs on every push to main and on every pull
# request so credential / PII leaks are caught before merge even when a
# contributor skips the local pre-commit hook (see .pre-commit-config.yaml).
#
# This complements, rather than replaces, the nbstripout hook: nbstripout
# strips notebook OUTPUTS, gitleaks scans SOURCE (including notebook source
# cells and any arbitrarily-named token file that slips past .gitignore).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks scans every commit on a push range /
          # PR, not just the tip. The action picks up .gitleaks.toml at the
          # repo root automatically.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for GitHub *organization*
          # accounts; personal and public repos run the action for free.
